<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Nova Shooter — E-school</title>
<style>
#nv-hud{position:absolute;inset:0;pointer-events:none;font-weight:700;color:#eef2ff;overflow:hidden}
.nv-p{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.14);backdrop-filter:blur(8px);border-radius:14px;padding:8px 12px}
#nv-tl{position:absolute;left:10px;top:10px;width:min(250px,44vw)}
.nv-bar{position:relative;height:16px;border-radius:8px;background:rgba(0,0,0,.45);overflow:hidden;border:1px solid rgba(255,255,255,.14)}
.nv-bar i{position:absolute;left:0;top:0;bottom:0;width:100%;transition:width .12s}
.nv-bar span{position:absolute;inset:0;text-align:center;font-size:.7rem;line-height:16px}
#nv-hpf{background:linear-gradient(90deg,#ff4d8d,#ff7b00)}
#nv-pw{margin-top:6px;font-size:.78rem;color:#ffe08a;min-height:16px}
#nv-tr{position:absolute;right:10px;top:10px;text-align:right}
#nv-sc{font-size:1.9rem;line-height:1.1;background:linear-gradient(90deg,#22d3ee,#7c5cff);-webkit-background-clip:text;color:transparent}
#nv-sub{font-size:.8rem;color:#94a3c4}
#nv-sub b{color:#fff}
#nv-bl{position:absolute;left:10px;bottom:10px;min-width:130px}
#nv-am{font-size:1.5rem;color:#22d3ee;line-height:1.1}
#nv-am small{font-size:.7rem;color:#94a3c4}
#nv-bc{position:absolute;left:50%;bottom:10px;transform:translateX(-50%);width:min(280px,40vw)}
#nv-nvf{background:linear-gradient(90deg,#7c5cff,#22d3ee);width:0}
#nv-bc.ready .nv-bar{box-shadow:0 0 16px #22d3ee;border-color:#22d3ee}
#nv-bc small{display:block;text-align:center;font-size:.68rem;color:#94a3c4;margin-top:3px}
#nv-dsf{background:#f5c542;width:100%}
#nv-boss{position:absolute;left:50%;top:10px;transform:translateX(-50%);width:min(340px,38vw);display:none;text-align:center;font-size:.72rem}
#nv-bsf{background:linear-gradient(90deg,#22d3ee,#7c5cff)}
#nv-ban{position:absolute;left:0;right:0;top:30%;text-align:center;font-size:clamp(1.6rem,6vw,3.2rem);font-weight:800;letter-spacing:3px;opacity:0;text-shadow:0 0 30px rgba(124,92,255,.8)}
#nv-ban small{display:block;font-size:.4em;letter-spacing:1px;color:#94a3c4;margin-top:6px}
#nv-ban.go{animation:nvban 2s ease-out}
@keyframes nvban{0%{opacity:0;transform:scale(.7)}12%{opacity:1;transform:scale(1.04)}70%{opacity:1}100%{opacity:0;transform:scale(1.1)}}
#nv-hint{position:absolute;left:50%;bottom:64px;transform:translateX(-50%);max-width:92vw;text-align:center;font-size:.85rem;color:#c9d4f5;background:rgba(0,0,0,.45);border-radius:12px;padding:8px 14px;opacity:0;transition:opacity .4s}
#nv-hint.on{opacity:1}
#nv-tb{display:none;position:absolute;right:10px;bottom:10px;flex-direction:column;gap:10px;pointer-events:auto}
body.nv-touch #nv-tb{display:flex}
#nv-tb button{width:58px;height:58px;border-radius:50%;border:1px solid rgba(255,255,255,.25);background:rgba(124,92,255,.35);color:#fff;font-size:1.5rem;touch-action:none}
#nv-tb button:active{background:rgba(255,77,141,.55)}
body.nv-touch #nv-bl{bottom:84px}
.nv-title{font-size:clamp(2rem,9vw,3.2rem);font-weight:800;letter-spacing:2px;background:linear-gradient(90deg,#22d3ee,#7c5cff,#ff4d8d);-webkit-background-clip:text;color:transparent;margin:0}
.nv-rec{display:flex;gap:10px;margin:14px 0 6px}
.nv-rec>div{flex:1;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.14);border-radius:16px;padding:10px}
.nv-rec small{display:block;color:#94a3c4;font-size:.72rem;letter-spacing:1px}
.nv-rec b{display:block;font-size:1.6rem;color:#ffe08a}
.nv-row{display:flex;gap:10px;padding:6px 10px;border-radius:10px;background:rgba(255,255,255,.04);margin-top:4px;text-align:left;font-size:.9rem}
.nv-row b{width:20px;color:#22d3ee}.nv-row span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.nv-row em{font-style:normal;color:#ffe08a}
.nv-stats{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin:12px 0}
.nv-stats div{background:rgba(255,255,255,.07);border-radius:12px;padding:8px}
.nv-stats small{display:block;color:#94a3c4;font-size:.7rem}.nv-stats b{font-size:1.2rem}
.nv-ok{color:#4ade80;font-weight:700}.nv-ko{color:#fb7185;font-weight:700}
.nv-dot{display:inline-block;width:26px;height:26px;border-radius:50%;vertical-align:middle;margin-right:6px;border:2px solid rgba(255,255,255,.4)}
</style>
</head>
<body>
<div id="game"></div>
<script src="config.js"></script>
<script src="commun.js"></script>
<script>
(function () {
'use strict';
if (EC.ui.lockedScreen()) return;
var TEST = /[?&]test=1/.test(location.search) && EC.cfg.devMode === true;
EC.register('nova', { coinsPerSec: 1.6, maxRun: 250, maxScore: 800000, perHour: 900 });
EC.ui.bar('NOVA SHOOTER');

/* =====================================================================
   1. SIMULATION PURE ET DÉTERMINISTE (aucun accès au DOM, au temps réel ni à Math.random)
   La partie jouée en direct et sa vérification (rejeu) utilisent exactement ce code.
   ===================================================================== */
var DT = 1 / 60, TAU = Math.PI * 2, NA = 512, RELOAD = 1.1, DASH_CD = 1.5;
var COS = new Float64Array(NA), SIN = new Float64Array(NA);
for (var ii = 0; ii < NA; ii++) { COS[ii] = Math.cos(ii / NA * TAU); SIN[ii] = Math.sin(ii / NA * TAU); }
var TRI = [[Math.cos(-.14), Math.sin(-.14)], [1, 0], [Math.cos(.14), Math.sin(.14)]];
function clamp(v, a, b) { return v < a ? a : v > b ? b : v; }
function aimIdx(dx, dy) { var a = Math.atan2(dy, dx); if (a < 0) a += TAU; return Math.round(a / TAU * NA) % NA; }
function segD2(ax, ay, bx, by, px, py) { var dx = bx - ax, dy = by - ay, l = dx * dx + dy * dy, t = l > 0 ? ((px - ax) * dx + (py - ay) * dy) / l : 0; t = t < 0 ? 0 : t > 1 ? 1 : t; var qx = ax + dx * t - px, qy = ay + dy * t - py; return qx * qx + qy * qy; }

/* entrée d'un pas : mx,my entiers -8..8, aim 0..511, fire/dash/rel/nova 0 ou 1 — emballée dans un seul entier pour le journal */
function pack(i) { return ((i.mx + 8) | 0) | (((i.my + 8) | 0) << 5) | (i.aim << 10) | (i.fire << 19) | (i.dash << 20) | (i.rel << 21) | (i.nova << 22); }
function unpack(v, o) { o.mx = (v & 31) - 8; o.my = ((v >> 5) & 31) - 8; o.aim = (v >> 10) & 511; o.fire = (v >> 19) & 1; o.dash = (v >> 20) & 1; o.rel = (v >> 21) & 1; o.nova = (v >> 22) & 1; return o; }

var ET = {
  drone:   { r: 13, hp: 1, spd: 118, dmg: 8,  pts: 10 },
  brute:   { r: 25, hp: 6, spd: 68,  dmg: 20, pts: 50 },
  shooter: { r: 14, hp: 2, spd: 92,  dmg: 8,  pts: 30 },
  reaper:  { r: 15, hp: 3, spd: 105, dmg: 14, pts: 40 },
  swarm:   { r: 19, hp: 4, spd: 84,  dmg: 10, pts: 25 },
  mini:    { r: 9,  hp: 1, spd: 150, dmg: 5,  pts: 5 },
  boss:    { r: 46, hp: 60, spd: 58, dmg: 25, pts: 500 }
};

function createSim(cfg, E) {
  var R = EC.util.seeded(cfg.seed >>> 0), W = cfg.w, H = cfg.h;
  var S = { t: 0, score: 0, kills: 0, wave: 0, combo: 0, mult: 1, ctime: 0, nova: 0, phase: 'intro', pt: 1.4, over: false, hurtW: false, bossHp: 0, bossMax: 0 };
  var P = { x: W / 2, y: H / 2, r: 14, hp: 100, max: 100, vx: 0, vy: 0, ai: 0, cx: 1, cy: 0, fcd: 0, ammo: 30, mag: 30, rel: 0, dash: 0, dcd: 0, dvx: 1, dvy: 0, inv: 0, shield: 0, rapid: 0, triple: 0, hurt: 0 };
  var B = [], EB = [], EN = [], PK = [], OB = [], Q = [], spawnT = 0, nid = 1;
  function ev(a, b, c, d, e) { if (E) E(a, b, c, d, e); }

  /* obstacles (générés avec la graine, jamais au centre) */
  (function () {
    var n = 4 + (R() * 3 | 0), tries = 0;
    while (OB.length < n && tries++ < 90) {
      var w = 90 + R() * 140, h = 60 + R() * 120, x = 70 + R() * (W - 140 - w), y = 70 + R() * (H - 140 - h);
      if (x < W / 2 + 170 && x + w > W / 2 - 170 && y < H / 2 + 150 && y + h > H / 2 - 150) continue;
      var ok = true;
      for (var i = 0; i < OB.length; i++) { var o = OB[i]; if (x < o.x + o.w + 60 && x + w + 60 > o.x && y < o.y + o.h + 60 && y + h + 60 > o.y) { ok = false; break; } }
      if (ok) OB.push({ x: x, y: y, w: w, h: h });
    }
  })();
  function pushRect(e) {
    for (var i = 0; i < OB.length; i++) {
      var o = OB[i], px = clamp(e.x, o.x, o.x + o.w), py = clamp(e.y, o.y, o.y + o.h), dx = e.x - px, dy = e.y - py, dd = dx * dx + dy * dy;
      if (dd < e.r * e.r) {
        if (dd > 1e-6) { var d = Math.sqrt(dd), p = e.r - d; e.x += dx / d * p; e.y += dy / d * p; }
        else { var l = e.x - o.x, rg = o.x + o.w - e.x, tp = e.y - o.y, bt = o.y + o.h - e.y, m = Math.min(l, rg, tp, bt); if (m === l) e.x = o.x - e.r; else if (m === rg) e.x = o.x + o.w + e.r; else if (m === tp) e.y = o.y - e.r; else e.y = o.y + o.h + e.r; }
      }
    }
    e.x = clamp(e.x, e.r, W - e.r); e.y = clamp(e.y, e.r, H - e.r);
  }
  function inObs(x, y, r) { for (var i = 0; i < OB.length; i++) { var o = OB[i]; if (x > o.x - r && x < o.x + o.w + r && y > o.y - r && y < o.y + o.h + r) return true; } return false; }

  function mkEnemy(type, x, y, sp) {
    var d = ET[type], hm = 1 + Math.floor(S.wave / 8) * .5, sm = Math.min(1.6, 1 + S.wave * .02);
    var hp = type === 'boss' ? 60 + 25 * Math.floor(S.wave / 5) : Math.ceil(d.hp * (type === 'mini' ? 1 : hm));
    var e = { id: nid++, t: type, x: x, y: y, r: d.r, hp: hp, max: hp, spd: d.spd * sm, dmg: d.dmg, pts: d.pts, vx: 0, vy: 0, sp: sp == null ? .6 : sp, fl: 0, st: 0, tm: R() * 1.2 + .5, ax: 0, ay: 0, ph: 0 };
    EN.push(e); return e;
  }
  function spawnPos() {
    var best = null, bd = -1;
    for (var k = 0; k < 6; k++) {
      var side = R() * 4 | 0, x, y;
      if (side === 0) { x = 40 + R() * (W - 80); y = 34; } else if (side === 1) { x = 40 + R() * (W - 80); y = H - 34; }
      else if (side === 2) { x = 34; y = 40 + R() * (H - 80); } else { x = W - 34; y = 40 + R() * (H - 80); }
      var dd = (x - P.x) * (x - P.x) + (y - P.y) * (y - P.y); if (dd > bd) { bd = dd; best = { x: x, y: y }; }
    }
    return best;
  }
  function startWave() {
    S.wave++; S.phase = 'fight'; S.hurtW = false; Q.length = 0;
    var w = S.wave;
    if (w % 5 === 0) {
      Q.push('boss'); var mn = Math.min(8, 2 + ((w / 5) | 0)); for (var i = 0; i < mn; i++) Q.push(R() < .5 ? 'drone' : 'shooter');
    } else {
      var budget = 5 + Math.floor(w * 2.2);
      while (budget > 0) {
        var c = [['drone', 1, 10]]; if (w >= 2) c.push(['shooter', 2, 5 + Math.min(w, 8)]); if (w >= 3) c.push(['brute', 4, 3 + (w >> 1)]); if (w >= 4) c.push(['reaper', 2, 4 + (w >> 1)]); if (w >= 6) c.push(['swarm', 3, 4]);
        var tot = 0, k; for (k = 0; k < c.length; k++) if (c[k][1] <= budget) tot += c[k][2];
        var r = R() * tot, pk = c[0]; for (k = 0; k < c.length; k++) { if (c[k][1] > budget) continue; r -= c[k][2]; if (r <= 0) { pk = c[k]; break; } }
        Q.push(pk[0]); budget -= pk[1];
      }
    }
    spawnT = .5; ev('wave', w, 0, w % 5 === 0 ? 1 : 0);
  }
  function eshot(e, ang, spd, dmg) { EB.push({ x: e.x + Math.cos(ang) * e.r, y: e.y + Math.sin(ang) * e.r, vx: Math.cos(ang) * spd, vy: Math.sin(ang) * spd, life: 4.5, dmg: dmg, r: 5 }); ev('eshot', e.x, e.y); }
  function drop(x, y, n) {
    for (var k = 0; k < n; k++) {
      var r = R(), t, wh = P.hp < 60 ? .42 : .22;
      if (r < wh) t = 'heal'; else if (r < wh + .26) t = 'rapid'; else if (r < wh + .5) t = 'triple'; else t = 'shield';
      PK.push({ x: x + (k ? (k % 2 ? 20 : -20) : 0), y: y, t: t, life: 11, r: 13 });
    }
  }
  function hurtP(d) {
    if (P.inv > 0 || P.dash > 0 || S.over) return false;
    if (P.shield > 0) { P.shield = 0; P.inv = .6; ev('shieldbreak', P.x, P.y); return true; }
    P.hp -= d; P.inv = .55; P.hurt = .3; S.combo = 0; S.mult = 1; S.hurtW = true; ev('hurt', P.x, P.y, d);
    if (P.hp <= 0) { P.hp = 0; S.over = true; ev('over', P.x, P.y); }
    return true;
  }
  function killEnemy(e) {
    var i = EN.indexOf(e); if (i < 0) return; EN.splice(i, 1);
    S.kills++; S.combo++; S.ctime = 2.6; S.mult = Math.min(8, 1 + (S.combo >> 2));
    var pts = e.pts * S.mult; S.score += pts; S.nova = Math.min(100, S.nova + (e.t === 'boss' ? 30 : e.t === 'brute' ? 7 : 4));
    ev('kill', e.x, e.y, pts, e);
    if (e.t === 'swarm') { mkEnemy('mini', e.x - 12, e.y, .15); mkEnemy('mini', e.x + 12, e.y, .15); }
    if (e.t === 'boss') { EB.length = 0; drop(e.x, e.y, 3); }
    else { var p = e.t === 'brute' ? .3 : (e.t === 'drone' || e.t === 'mini') ? .05 : .13; if (P.hp < 45) p += .06; if (R() < p) drop(e.x, e.y, 1); }
  }
  function damageEnemy(e, dmg, kx, ky) { e.hp -= dmg; e.fl = .07; e.x += kx || 0; e.y += ky || 0; ev('hit', e.x, e.y, 0, e); if (e.hp <= 0) killEnemy(e); }

  function step(inp) {
    if (S.over) return;
    var i, j, e, b, dx, dy, d;
    if (P.fcd > 0) P.fcd -= DT; if (P.inv > 0) P.inv -= DT; if (P.hurt > 0) P.hurt -= DT; if (P.dcd > 0) P.dcd -= DT;
    if (P.rapid > 0) P.rapid -= DT; if (P.triple > 0) P.triple -= DT; if (P.shield > 0) P.shield -= DT;
    if (S.ctime > 0) { S.ctime -= DT; if (S.ctime <= 0) { S.combo = 0; S.mult = 1; } }
    P.ai = inp.aim; P.cx = COS[P.ai]; P.cy = SIN[P.ai];
    /* recharge */
    if (P.rel > 0) { P.rel -= DT; if (P.rel <= 0) { P.rel = 0; P.ammo = P.mag; ev('reloaded'); } }
    else if (inp.rel && P.ammo < P.mag) { P.rel = RELOAD; ev('reload'); }
    /* esquive (invulnérable pendant l'élan) */
    var mx = inp.mx / 8, my = inp.my / 8, ml = Math.sqrt(mx * mx + my * my);
    if (inp.dash && P.dash <= 0 && P.dcd <= 0) {
      if (ml < .1) { P.dvx = P.cx; P.dvy = P.cy; } else { P.dvx = mx / ml; P.dvy = my / ml; }
      P.dash = .17; P.dcd = DASH_CD; if (P.inv < .22) P.inv = .22; ev('dash', P.x, P.y);
    }
    if (P.dash > 0) { P.dash -= DT; P.vx = P.dvx * 820; P.vy = P.dvy * 820; }
    else { if (ml > 1) { mx /= ml; my /= ml; } var sp = 270 * (P.rel > 0 ? .92 : 1), k = Math.min(1, 16 * DT); P.vx += (mx * sp - P.vx) * k; P.vy += (my * sp - P.vy) * k; }
    P.x += P.vx * DT; P.y += P.vy * DT; pushRect(P);
    /* tir */
    if (inp.fire && P.fcd <= 0 && P.rel <= 0) {
      if (P.ammo > 0 || P.rapid > 0) {
        var n = P.triple > 0 ? 3 : 1;
        for (i = 0; i < n; i++) {
          var tv = n === 1 ? TRI[1] : TRI[i], dxx = P.cx * tv[0] - P.cy * tv[1], dyy = P.cx * tv[1] + P.cy * tv[0];
          B.push({ x: P.x + dxx * 24, y: P.y + dyy * 24, vx: dxx * 920, vy: dyy * 920, life: 1.1 });
        }
        P.fcd = P.rapid > 0 ? .075 : .125; if (P.rapid <= 0) P.ammo--;
        ev('shot', P.x + P.cx * 26, P.y + P.cy * 26);
        if (P.ammo <= 0 && P.rapid <= 0) { P.rel = RELOAD; ev('reload'); }
      } else { P.rel = RELOAD; ev('reload'); }
    }
    /* Nova : onde de choc, détruit les tirs ennemis et blesse les proches */
    if (inp.nova && S.nova >= 100) {
      S.nova = 0; EB.length = 0; if (P.inv < .5) P.inv = .5; ev('nova', P.x, P.y);
      var ls = EN.slice();
      for (i = 0; i < ls.length; i++) { e = ls[i]; dx = e.x - P.x; dy = e.y - P.y; d = Math.sqrt(dx * dx + dy * dy) || 1; if (d < 340) damageEnemy(e, e.t === 'boss' ? 12 : 8, dx / d * 30, dy / d * 30); }
    }
    /* vagues */
    if (S.phase === 'intro') { S.pt -= DT; if (S.pt <= 0) startWave(); }
    else if (S.phase === 'fight') {
      spawnT -= DT;
      while (Q.length && spawnT <= 0 && EN.length < 42) {
        var ty = Q.shift(), sp2;
        if (ty === 'boss') { sp2 = { x: W / 2, y: 60 }; S.bossMax = 0; } else sp2 = spawnPos();
        mkEnemy(ty, sp2.x, sp2.y, ty === 'boss' ? 1.2 : .6);
        spawnT = Math.max(.22, .85 - S.wave * .025);
      }
      if (!Q.length && !EN.length) {
        S.phase = 'clear'; S.pt = 2.2; var bonus = 60 * S.wave + (S.hurtW ? 0 : 150 * S.wave); S.score += bonus;
        P.hp = Math.min(P.max, P.hp + 8); P.ammo = P.mag; ev('clear', S.wave, 0, bonus);
      }
    } else if (S.phase === 'clear') { S.pt -= DT; if (S.pt <= 0) startWave(); }
    /* ennemis */
    var boss = null;
    for (i = 0; i < EN.length; i++) {
      e = EN[i]; if (e.fl > 0) e.fl -= DT;
      if (e.t === 'boss') boss = e;
      if (e.sp > 0) { e.sp -= DT; continue; }
      dx = P.x - e.x; dy = P.y - e.y; d = Math.sqrt(dx * dx + dy * dy) || 1;
      var ux = dx / d, uy = dy / d, tx = ux, ty2 = uy, spd = e.spd, direct = false;
      if (e.t === 'shooter') {
        var want = d > 330 ? 1 : d < 230 ? -1 : 0; if (!e.ph) e.ph = R() < .5 ? 1 : -1;
        tx = ux * want - uy * e.ph * .8; ty2 = uy * want + ux * e.ph * .8;
        e.tm -= DT;
        if (e.st === 0 && e.tm <= 0) { e.st = 1; e.tm = .4; }
        else if (e.st === 1 && e.tm <= 0) { eshot(e, Math.atan2(dy, dx), 270, 10); e.st = 0; e.tm = 1.5 + R() * .9; if (R() < .3) e.ph = -e.ph; }
      } else if (e.t === 'reaper') {
        e.tm -= DT;
        if (e.st === 0) { if (e.tm <= 0) { e.st = 1; e.tm = .55; e.ax = ux; e.ay = uy; } }
        else if (e.st === 1) { tx = 0; ty2 = 0; if (e.tm > .15) { e.ax = ux; e.ay = uy; } if (e.tm <= 0) { e.st = 2; e.tm = .32; } }
        else if (e.st === 2) { e.vx = e.ax * 560; e.vy = e.ay * 560; direct = true; if (e.tm <= 0) { e.st = 3; e.tm = .45; } }
        else { tx = 0; ty2 = 0; if (e.tm <= 0) { e.st = 0; e.tm = 1.4 + R() * .8; } }
      } else if (e.t === 'boss') {
        if (!e.ph) e.ph = 1;
        var wb = d > 320 ? 1 : d < 230 ? -.7 : 0; tx = ux * wb - uy * e.ph * .6; ty2 = uy * wb + ux * e.ph * .6; spd = e.spd * (e.hp < e.max * .5 ? 1.25 : 1);
        e.tm -= DT;
        if (e.tm <= 0) {
          e.st++; var nn = 12 + Math.min(10, S.wave >> 1), rot = R() * TAU;

EC.ui.setQuit(function () { if (state === 'play') pauseGame(); else EC.quit(); });
layout(); showMenu();

if (TEST) window.__test = {
  createSim: createSim, replayAll: replayAll, pack: pack, unpack: unpack, aimIdx: aimIdx,
  get: function () { return { state: state, S: sim && sim.S, P: sim && sim.P, log: log, cfg: cfg, tainted: tainted }; },
  sim: function () { return sim; }
};
})();
</script>
