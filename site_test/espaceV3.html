<!DOCTYPE html>
<html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mon espace - E-school</title>
<style>
:root{--a1:#7c5cff;--a2:#22d3ee;--a3:#ff4d8d;--mu:#94a3c4;--gl:rgba(255,255,255,.06);--bd:rgba(255,255,255,.12)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden}
body{font-family:Inter,'Segoe UI',system-ui,sans-serif;background:#05070f;color:#eef2ff;user-select:none;letter-spacing:-.01em}
#bg{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
.aur{position:fixed;border-radius:50%;filter:blur(110px);opacity:.45;z-index:0;pointer-events:none;animation:dr 18s ease-in-out infinite alternate}
.a1{width:520px;height:520px;background:var(--a1);top:-160px;left:-80px}
.a2{width:460px;height:460px;background:var(--a2);bottom:-180px;right:-100px;animation-delay:-6s;opacity:.3}
.a3{width:360px;height:360px;background:var(--a3);top:35%;left:48%;animation-delay:-11s;opacity:.22}
@keyframes dr{to{transform:translate(90px,60px) scale(1.2)}}
.foc{outline:none;font-family:inherit}
#splash{position:fixed;inset:0;z-index:100;display:grid;place-items:center;text-align:center;background:radial-gradient(circle at 50% 40%,#241a5e,#05070f 70%);transition:opacity .7s,transform .7s;cursor:pointer}
#splash.off{opacity:0;transform:scale(1.15);pointer-events:none}
#splash h1{font-size:3.6rem;font-weight:800;letter-spacing:3px;background:linear-gradient(90deg,var(--a2),var(--a1),var(--a3));-webkit-background-clip:text;color:transparent;animation:lg 2.4s ease-in-out infinite}
#splash p{margin-top:24px;color:var(--mu);animation:bl 1.6s infinite}
@keyframes lg{50%{filter:drop-shadow(0 0 28px var(--a1));transform:scale(1.04)}}
@keyframes bl{50%{opacity:.3}}
#app{position:fixed;inset:0;z-index:1;display:flex;flex-direction:column}
.top{margin:16px 24px 0;padding:10px 14px;border-radius:24px;display:flex;align-items:center;gap:14px;background:var(--gl);border:1px solid var(--bd);backdrop-filter:blur(18px)}
.logo{font-weight:800;letter-spacing:2px;font-size:1.15rem;background:linear-gradient(90deg,var(--a2),var(--a1),var(--a3));-webkit-background-clip:text;color:transparent;padding:0 8px}
.tabs{display:flex;gap:4px;flex:1;overflow-x:auto;background:rgba(0,0,0,.28);padding:4px;border-radius:18px;justify-content:center}
.tab{background:none;border:0;color:var(--mu);font-size:.98rem;font-weight:600;padding:9px 16px;border-radius:14px;cursor:pointer;white-space:nowrap;transition:.2s}
.tab.cur{background:rgba(255,255,255,.14);color:#fff}
.tab.on{background:linear-gradient(135deg,var(--a1),var(--a3));color:#fff;transform:scale(1.06);box-shadow:0 8px 24px -6px var(--a1)}
.chip{background:var(--gl);border:1px solid var(--bd);color:#dfe6ff;font-size:.9rem;padding:8px 14px;border-radius:14px;cursor:default;white-space:nowrap;transition:.2s}
button.chip{cursor:pointer}
.chip.on{background:linear-gradient(135deg,var(--a1),var(--a3));color:#fff;transform:scale(1.06)}
#view{flex:1;overflow:auto;padding:18px 28px 12px;animation:in .4s}
@keyframes in{from{opacity:0;transform:translateY(14px)}}
.greet h1{font-size:2.3rem;font-weight:800}
.greet p{color:var(--mu);margin:4px 0 0}
.stats{display:flex;gap:12px;flex-wrap:wrap;margin:16px 0 6px}
.st{background:var(--gl);border:1px solid var(--bd);border-radius:16px;padding:10px 16px;font-size:.9rem;color:var(--mu);backdrop-filter:blur(10px)}
.st b{font-size:1.2rem;color:#fff;margin-right:4px}
.bento{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));grid-auto-rows:190px;gap:18px;padding:18px 8px 30px}
.bento .wide,.hero{grid-column:span 2}
.row{display:flex;gap:20px;padding:30px 10px 40px;overflow-x:auto}
.row .tile{flex:0 0 230px;height:280px}
.tile,.hero{border:1px solid var(--bd);border-radius:26px;color:#fff;text-align:left;padding:20px;cursor:pointer;position:relative;overflow:hidden;transition:transform .25s cubic-bezier(.2,.8,.2,1),box-shadow .25s,border-color .25s}
.tile{display:flex;flex-direction:column;justify-content:flex-end;background:radial-gradient(130% 110% at 0% 0%,var(--c1),transparent 62%),rgba(255,255,255,.05)}
.tile .ic{position:absolute;top:18px;left:18px;width:52px;height:52px;border-radius:16px;display:grid;place-items:center;font-size:1.7rem;font-weight:800;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.2)}
.tile h3{font-size:1.2rem;font-weight:700}.tile small{color:#ffffffb0}
.hero{display:flex;align-items:center;justify-content:space-between;gap:20px;background:radial-gradient(120% 140% at 0% 0%,rgba(124,92,255,.7),transparent 60%),radial-gradient(100% 120% at 100% 100%,rgba(255,77,141,.5),transparent 60%),rgba(255,255,255,.05)}
.hero small{letter-spacing:2px;color:#ffffffc0;font-weight:700}.hero h2{font-size:1.6rem;margin:6px 0}.hero p{color:#ffffffc0}
.hero svg{min-width:92px;width:92px;height:92px}
.tile.on,.hero.on{transform:translateY(-6px) scale(1.04);z-index:2;border-color:#fff;box-shadow:0 0 0 2px #fff,0 24px 60px -12px var(--c1)}
.tile.on::after,.hero.on::after{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 30%,rgba(255,255,255,.22) 50%,transparent 70%);transform:translateX(-100%);animation:sh 1.5s infinite;pointer-events:none}
@keyframes sh{to{transform:translateX(100%)}}
.pl{display:grid;grid-template-columns:1.7fr 1fr;gap:28px;padding:10px}
.vid{width:100%;aspect-ratio:16/9;border:0;border-radius:24px;background:#000;box-shadow:0 20px 60px -10px #000}
.info{background:var(--gl);border:1px solid var(--bd);border-radius:26px;padding:26px;backdrop-filter:blur(14px)}
.info h1{font-size:1.6rem;margin-bottom:8px}.info p{color:var(--mu);margin-bottom:14px}
.btn{display:block;width:100%;margin-top:12px;padding:14px 18px;border-radius:16px;border:1px solid var(--bd);background:rgba(255,255,255,.08);color:#fff;font-size:1rem;font-weight:600;text-align:left;cursor:pointer;transition:.2s}
.btn.on{background:linear-gradient(135deg,var(--a1),var(--a3));border-color:transparent;transform:scale(1.04);box-shadow:0 12px 30px -8px var(--a1)}
.soon{text-align:center;padding:60px 20px}.soon div{font-size:4rem}.soon p{color:var(--mu);margin:10px auto 20px}.soon .btn{max-width:260px;margin:auto;text-align:center}
.com{display:grid;grid-template-columns:250px 1fr;gap:20px;height:calc(100vh - 200px);min-height:380px;padding:6px}
.salons{display:flex;flex-direction:column;gap:8px;overflow-y:auto}
.salons h2{font-size:1.1rem;margin:4px 6px 6px}
.room{padding:13px 16px;border-radius:16px;border:1px solid var(--bd);background:var(--gl);color:#fff;font-size:.98rem;font-weight:600;text-align:left;cursor:pointer;transition:.2s}
.room.cur{border-color:var(--a2);background:rgba(34,211,238,.12)}
.room.on{background:linear-gradient(135deg,var(--a1),var(--a3));border-color:transparent;transform:translateX(6px)}
.chat{display:flex;flex-direction:column;min-height:0;background:var(--gl);border:1px solid var(--bd);border-radius:26px;overflow:hidden;backdrop-filter:blur(14px)}
.chead{padding:14px 20px;border-bottom:1px solid var(--bd)}.chead small{color:var(--mu)}
#msgs{flex:1;overflow-y:auto;padding:18px 20px;display:flex;flex-direction:column;gap:14px;user-select:text}
.mg{display:flex;gap:10px;max-width:78%}.mg.me{margin-left:auto;flex-direction:row-reverse}
.av{min-width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-weight:700;background:hsl(var(--h),65%,45%)}
.bb{background:rgba(255,255,255,.09);border-radius:18px;padding:9px 14px;word-break:break-word}
.mg.me .bb{background:linear-gradient(135deg,var(--a1),var(--a3))}
.bb small{color:#ffffff90;margin-left:6px;font-size:.75rem}.bb p{margin-top:2px}
.cin{display:flex;gap:10px;padding:14px;border-top:1px solid var(--bd)}
#ci{flex:1;padding:13px 16px;border-radius:16px;border:1px solid var(--bd);background:rgba(0,0,0,.3);color:#fff;font-size:1rem;user-select:text}
#ci.on{border-color:var(--a2);box-shadow:0 0 0 3px rgba(34,211,238,.25)}
.hints{padding:8px 24px 12px;color:var(--mu);font-size:.82rem;text-align:center}
kbd{background:rgba(255,255,255,.1);border:1px solid var(--bd);border-radius:6px;padding:2px 8px;margin:0 3px;color:#fff}
#modal{position:fixed;inset:0;z-index:50;display:none;place-items:center;background:rgba(3,5,12,.75);backdrop-filter:blur(8px)}
#modal.show{display:grid;animation:fi .2s}
@keyframes fi{from{opacity:0}}
#box{background:rgba(24,28,60,.92);border:1px solid var(--bd);border-radius:28px;padding:30px;width:min(460px,92vw);animation:pop .3s cubic-bezier(.2,1.4,.4,1);box-shadow:0 30px 80px -20px #000}
@keyframes pop{from{transform:scale(.85);opacity:0}}
#box h2{margin-bottom:6px}#box p{color:var(--mu);margin-bottom:6px}
#toast{position:fixed;right:24px;bottom:-130px;z-index:60;display:flex;gap:14px;align-items:center;background:rgba(24,28,60,.95);border:1px solid var(--a2);border-radius:20px;padding:14px 22px;box-shadow:0 0 40px rgba(34,211,238,.35);transition:bottom .5s cubic-bezier(.2,1.3,.4,1)}
#toast.show{bottom:26px}#toast span{font-size:2rem}#toast small{color:var(--mu)}
@media(max-width:820px){.pl,.com{grid-template-columns:1fr}.com{height:auto}#msgs{min-height:260px}.salons{flex-direction:row;overflow-x:auto}.hints,.logo{display:none}.top{margin:8px;flex-wrap:wrap}#view{padding:10px 12px}.hero,.bento .wide{grid-column:span 1}}
</style></head><body>
<canvas id="bg"></canvas><div class="aur a1"></div><div class="aur a2"></div><div class="aur a3"></div>

<div id="splash"><div><h1>E-SCHOOL</h1><p>Appuie sur ENTRÉE ou clique pour démarrer</p></div></div>

<div id="app">
 <div class="top">
  <div class="logo">E-SCHOOL</div>
  <div class="tabs">
   <button class="tab foc" data-a="go" data-p="home">Accueil</button>
   <button class="tab foc" data-a="go" data-p="lessons">Leçons</button>
   <button class="tab foc" data-a="go" data-p="community">Communauté</button>
   <button class="tab foc" data-a="go" data-p="detente">Détente</button>
   <button class="tab foc" data-a="go" data-p="atelier">Atelier</button>
   <button class="tab foc" data-a="go" data-p="nova">Nova</button>
  </div>
  <button class="chip foc" data-a="svc" id="svc"></button>
  <span class="chip" id="xpc"></span>
  <span class="chip" id="clk"></span>
  <button class="chip foc" data-a="mute" id="mt">🔊</button>
 </div>
 <div id="view"></div>
 <div class="hints"><kbd>←</kbd><kbd>↑</kbd><kbd>↓</kbd><kbd>→</kbd> Naviguer <kbd>Entrée</kbd> Valider <kbd>Échap</kbd> Retour</div>
</div>

<div id="modal"><div id="box"></div></div>
<div id="toast"><span>🏆</span><div><b id="tt"></b><br><small id="ts"></small></div></div>

<script>
var $=function(i){return document.getElementById(i)},L=localStorage;

// ===== Chat en direct : colle ici ta config Firebase (sinon mode local) =====
// Exemple : var FB={apiKey:"...",authDomain:"...",projectId:"...",appId:"..."};
var FB=null;

var S={cours:{n:"Cours en ligne",e:"💻"},soutien:{n:"Soutien individuel",e:"🧑‍🏫"},tutorat:{n:"Tutorat en direct",e:"🎥"},formation:{n:"Formation avec certificat",e:"🏆"}};
// [titre, durée, vidéo (fichier dans /videos ou lien YouTube), résumé]
var LC={
cours:[["Introduction au cours","10 min","videos/cours1.mp4","Découvre le programme et comment bien apprendre."],["Leçon 1 : les bases","15 min","videos/cours2.mp4","Les notions essentielles à maîtriser."],["Leçon 2 : s'entraîner","20 min","videos/cours3.mp4","Des exemples et des exercices guidés."]],
soutien:[["Faire le point","10 min","videos/soutien1.mp4","Identifie tes forces et tes difficultés."],["Méthode de travail","15 min","videos/soutien2.mp4","Organise tes révisions efficacement."],["Préparer la séance","10 min","videos/soutien3.mp4","Prépare tes questions."]],
tutorat:[["Suivre un cours en direct","10 min","videos/tutorat1.mp4","Prépare-toi avant chaque session."],["Replay : session type","25 min","videos/tutorat2.mp4","Revois une session complète."],["Bien poser ses questions","10 min","videos/tutorat3.mp4","Apprends à poser des questions utiles."]],
formation:[["Module 1 : démarrer","15 min","videos/formation1.mp4","Présentation du parcours."],["Module 2 : approfondir","20 min","videos/formation2.mp4","Les compétences clés."],["Module 3 : projet final","25 min","videos/formation3.mp4","Le projet qui valide ta formation."]]
};
var cur="cours",t0=(L.getItem("service")||"").toLowerCase();
for(var k in S)if(t0.indexOf(k)>-1)cur=k;
var nom=L.getItem("nom")||L.getItem("prenom")||"Explorateur",xp=+L.getItem("es_xp")||0;
function dn(){try{return JSON.parse(L.getItem("es_done_"+cur))||[]}catch(e){return[]}}
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}

// ===== Sons =====
var AC=null,mute=L.getItem("es_mute")==="1";
var SN={
move:[[900,0,.05,.05,"sine"]],
ok:[[600,0,.07,.08,"triangle"],[900,.07,.1,.08,"triangle"]],
back:[[700,0,.07,.07,"triangle"],[450,.07,.12,.07,"triangle"]],
open:[[500,0,.1,.06,"sine"],[750,.08,.14,.06,"sine"],[1000,.16,.22,.05,"sine"]],
err:[[220,0,.12,.07,"square"]],
msg:[[1100,0,.08,.06,"sine"],[1500,.08,.12,.06,"sine"]],
ach:[[784,0,.12,.07,"triangle"],[988,.12,.12,.07,"triangle"],[1175,.24,.35,.07,"triangle"]],
start:[[392,0,.2,.07,"sine"],[523,.15,.2,.07,"sine"],[659,.3,.2,.07,"sine"],[784,.45,.5,.08,"sine"]]
};
function snd(n){if(mute||!AC)return;var t=AC.currentTime;SN[n].forEach(function(s){var o=AC.createOscillator(),g=AC.createGain();o.type=s[4];o.frequency.value=s[0];g.gain.setValueAtTime(0,t+s[1]);g.gain.linearRampToValueAtTime(s[3],t+s[1]+.01);g.gain.exponentialRampToValueAtTime(.0001,t+s[1]+s[2]);o.connect(g);g.connect(AC.destination);o.start(t+s[1]);o.stop(t+s[1]+s[2]+.03)})}

// ===== Vidéo =====
function vErr(el){el.outerHTML='<div class="info"><p>🎬 Vidéo bientôt disponible. Ajoute le fichier dans le dossier <b>videos</b> ou un lien YouTube.</p></div>'}
function srcHtml(u){var m=u.match(/(?:v=|youtu\.be\/|embed\/)([\w-]{11})/);
 if(m)return '<iframe class="vid" src="https://www.youtube.com/embed/'+m[1]+'" allowfullscreen></iframe>';
 return '<video class="vid" controls src="'+u+'" onerror="vErr(this)"></video>'}

// ===== Chat =====
var room="general",msgs=[],db=null,unsub=null;
function fbInit(cb){
 if(!FB){cb(false);return}
 if(db){cb(true);return}
 var u=["https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js","https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"];
 function load(i){
  if(i>=u.length){try{firebase.initializeApp(FB);db=firebase.firestore();cb(true)}catch(e){cb(false)}return}
  var s=document.createElement("script");s.src=u[i];s.onload=function(){load(i+1)};s.onerror=function(){cb(false)};document.head.appendChild(s)}
 load(0)}
function hue(s){var h=0;for(var i=0;i<s.length;i++)h=(h*31+s.charCodeAt(i))%360;return h}
function hm(t){var d=new Date(t);return ("0"+d.getHours()).slice(-2)+":"+("0"+d.getMinutes()).slice(-2)}
function msgHtml(m){var me=m.n===nom;
 return '<div class="mg'+(me?' me':'')+'"><div class="av" style="--h:'+hue(m.n||"?")+'">'+esc((m.n||"?").charAt(0).toUpperCase())+'</div><div class="bb"><b>'+esc(m.n)+'</b><small>'+hm(m.t)+'</small><p>'+esc(m.x)+'</p></div></div>'}
function renderMsgs(){var el=$("msgs");if(!el)return;
 el.innerHTML=msgs.length?msgs.map(msgHtml).join(""):'<p style="color:var(--mu);text-align:center;margin:auto">Aucun message. Sois le premier à écrire 👋</p>';
 el.scrollTop=el.scrollHeight}
function listen(){
 if(unsub){unsub();unsub=null}
 msgs=[];
 if(db){
  unsub=db.collection("salons").doc(room).collection("messages").orderBy("t").limitToLast(60).onSnapshot(function(sn){
   var n0=msgs.length;msgs=sn.docs.map(function(d){return d.data()});
   if(n0>0&&msgs.length>n0&&msgs[msgs.length-1].n!==nom)snd("msg");
   renderMsgs()})
 }else{try{msgs=JSON.parse(L.getItem("es_chat_"+room)||"[]")}catch(e){msgs=[]}renderMsgs()}}
function sendMsg(x){
 var m={n:nom,x:x,t:Date.now()};
 if(db){db.collection("salons").doc(room).collection("messages").add(m)}
 else{msgs.push(m);L.setItem("es_chat_"+room,JSON.stringify(msgs.slice(-60)));renderMsgs()}}

// ===== Écrans =====
function T(a,p,ic,t,s,c,w){return '<button class="tile foc'+(w?' wide':'')+'" data-a="'+a+'" data-p="'+p+'" style="--c1:'+c+'"><span class="ic">'+ic+'</span><h3>'+t+'</h3><small>'+s+'</small></button>'}
function nextL(){var d=dn(),a=LC[cur];for(var i=0;i<a.length;i++)if(d.indexOf(i)<0)return i;return -1}
function soon(t){return '<div class="soon"><div>🚧</div><h1>'+t+'</h1><p>Contenu à venir. On va le construire ensemble.</p><button class="btn foc" data-a="back">← Retour</button></div>'}
function rooms(){return [["general","💬","Général"],["aide","🤝","Aide aux devoirs"],["detente","🎮","Détente"],["svc_"+cur,S[cur].e,S[cur].n]]}
var V={
home:function(){var n=nextL(),a=LC[cur],d=dn(),lv=Math.floor(xp/100),pc=d.length/a.length,off=Math.round(214*(1-pc));
 var hero='<button class="hero foc" data-a="'+(n<0?'go':'open')+'" data-p="'+(n<0?'lessons':n)+'" style="--c1:#7c5cff"><div><small>'+(n<0?'TERMINÉ':'CONTINUER')+'</small><h2>'+(n<0?'Bravo, tout est terminé 🎉':a[n][0])+'</h2><p>'+(n<0?'Revois tes leçons quand tu veux':'⏱ '+a[n][1]+' · Reprends ta progression')+'</p></div>'
 +'<svg viewBox="0 0 80 80"><circle cx="40" cy="40" r="34" fill="none" stroke="rgba(255,255,255,.2)" stroke-width="7"/><circle cx="40" cy="40" r="34" fill="none" stroke="#fff" stroke-width="7" stroke-linecap="round" stroke-dasharray="214" stroke-dashoffset="'+off+'" transform="rotate(-90 40 40)"/><text x="40" y="45" text-anchor="middle" fill="#fff" font-size="16" font-weight="700">'+Math.round(pc*100)+'%</text></svg></button>';
 return '<div class="greet"><h1>Salut '+esc(nom)+' 👋</h1><p>'+S[cur].e+' '+S[cur].n+'</p></div>'
 +'<div class="stats"><div class="st"><b>'+(lv+1)+'</b>niveau</div><div class="st"><b>'+xp+'</b>XP</div><div class="st"><b>'+d.length+'/'+a.length+'</b>leçons</div></div>'
 +'<div class="bento">'+hero
 +T("go","lessons","📖","Leçons",d.length+" / "+a.length+" terminées","#22d3ee")
 +T("go","community","💬","Communauté","Discute avec les autres élèves","#ff4d8d",1)
 +T("go","detente","🎮","Détente","Pause et jeux","#a855f7")
 +T("go","atelier","🛠️","Atelier","Tes notes","#f59e0b")
 +T("go","nova","✨","Nova","Assistant IA","#10b981")
 +T("quit","","🚪","Quitter","Retour au site","#64748b")+'</div>'},
lessons:function(){var a=LC[cur],d=dn();
 return '<div class="greet"><h1>📖 Leçons</h1><p>'+S[cur].n+' · '+d.length+' / '+a.length+' terminées</p></div><div class="row">'
 +a.map(function(l,i){var ok=d.indexOf(i)>-1;return T("open",i,ok?"✅":(i+1),l[0],"⏱ "+l[1],ok?"#22c55e":"#6366f1")}).join("")+'</div>'},
player:function(i){var l=LC[cur][i],ok=dn().indexOf(i)>-1,last=i>=LC[cur].length-1;
 return '<div class="pl"><div>'+srcHtml(l[2])+'</div><div class="info"><h1>'+l[0]+'</h1><p>'+l[3]+'</p>'
 +'<button class="btn foc" data-a="finish" data-p="'+i+'">'+(ok?'✅ Déjà terminée':'✔ Terminer la leçon (+30 XP)')+'</button>'
 +(last?'':'<button class="btn foc" data-a="open" data-p="'+(i+1)+'">Leçon suivante →</button>')
 +'<button class="btn foc" data-a="back">← Retour</button></div></div>'},
community:function(){var rs=rooms(),r=rs.filter(function(x){return x[0]===room})[0];if(!r){r=rs[0];room=r[0]}
 return '<div class="com"><div class="salons"><h2>Salons</h2>'
 +rs.map(function(x){return '<button class="room foc'+(x[0]===room?' cur':'')+'" data-a="room" data-p="'+x[0]+'">'+x[1]+' '+x[2]+'</button>'}).join("")
 +'<button class="room foc" data-a="pseudo">✏️ Pseudo : '+esc(nom)+'</button></div>'
 +'<div class="chat"><div class="chead"><b>'+r[1]+' '+r[2]+'</b><br><small id="cstat">Connexion...</small></div><div id="msgs"></div>'
 +'<div class="cin"><input id="ci" class="foc" data-a="typing" maxlength="300" placeholder="Écris un message... (sois respectueux, aucune info personnelle)" autocomplete="off"><button class="btn foc" style="width:auto;margin:0" data-a="send">Envoyer ➤</button></div></div></div>'},
detente:function(){return soon("🎮 Détente")},
atelier:function(){return soon("🛠️ Atelier")},
nova:function(){return soon("✨ Nova")}
};
var stack=[["home"]],vw="home";
function show(v,a){vw=v;$("view").innerHTML=V[v](a);
 document.querySelectorAll(".tab").forEach(function(b){b.classList.toggle("cur",b.dataset.p===(v==="player"?"lessons":v))});
 hud();fo=null;setf($("view").querySelector(".foc")||list()[0],true);
 if(v==="community"){renderMsgs();fbInit(function(ok){var c=$("cstat");if(c)c.textContent=ok?"🟢 En direct avec les autres élèves":"🟡 Mode local : toi seul vois les messages (Firebase non configuré)";listen()})}
 else if(unsub){unsub();unsub=null}}
function hud(){$("xpc").textContent="⭐ "+xp+" XP";$("svc").textContent=S[cur].e+" "+S[cur].n;$("mt").textContent=mute?"🔇":"🔊"}

// ===== Focus =====
var fo=null,pf=null;
function modalOn(){return $("modal").classList.contains("show")}
function list(){return [].slice.call((modalOn()?$("box"):$("app")).querySelectorAll(".foc")).filter(function(e){return e.offsetParent!==null})}
function setf(el,quiet){if(!el)return;if(fo)fo.classList.remove("on");fo=el;el.classList.add("on");el.scrollIntoView({block:"nearest",inline:"center",behavior:"smooth"});if(!quiet)snd("move")}
function mv(dx,dy){var l=list();if(!fo||l.indexOf(fo)<0){setf(l[0],true);return}
 var r=fo.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2,best=null,bs=1e9;
 l.forEach(function(e){if(e===fo)return;var q=e.getBoundingClientRect(),x=q.left+q.width/2-cx,y=q.top+q.height/2-cy,p=dx?x*dx:y*dy;if(p<=4)return;var sc=p+(dx?Math.abs(y):Math.abs(x))*2.2;if(sc<bs){bs=sc;best=e}});
 if(best)setf(best);else snd("err")}

// ===== Confirmation =====
function ask(title,text,btns){pf=fo;var b=$("box");b.innerHTML="<h2>"+title+"</h2><p>"+text+"</p>";
 btns.forEach(function(x){var el=document.createElement("button");el.className="btn foc";el.textContent=x[0];
  el.onclick=function(){closeM();snd(x[2]||"ok");if(x[1])x[1]()};b.appendChild(el)});
 $("modal").classList.add("show");snd("open");fo=null;setf(b.querySelector(".foc"),true)}
function closeM(){$("modal").classList.remove("show");if(pf&&document.body.contains(pf))setf(pf,true)}

// ===== Succès =====
var tm;function achv(t,s){$("tt").textContent=t;$("ts").textContent=s;$("toast").classList.add("show");snd("ach");clearTimeout(tm);tm=setTimeout(function(){$("toast").classList.remove("show")},3800)}
function complete(i){var d=dn(),lv0=Math.floor(xp/100);
 if(d.indexOf(i)<0){d.push(i);L.setItem("es_done_"+cur,JSON.stringify(d));xp+=30;L.setItem("es_xp",xp);
  achv("Leçon terminée","+30 XP · "+LC[cur][i][0]);
  var lv=Math.floor(xp/100);if(lv>lv0)setTimeout(function(){achv("Niveau "+(lv+1)+" atteint !","Continue comme ça")},4300)}
 show("player",i)}

// ===== Actions =====
function back(){
 if(modalOn()){closeM();snd("back");return}
 if(stack.length>1){stack.pop();var s=stack[stack.length-1];snd("back");show(s[0],s[1])}
 else act("quit")}
function act(a,p){
 if(a==="go"){snd("ok");stack=[[p]];show(p)}
 else if(a==="open"){snd("ok");stack.push(["player",+p]);show("player",+p)}
 else if(a==="back")back();
 else if(a==="finish"){if(dn().indexOf(+p)>-1){snd("err");return}
  ask("Terminer la leçon ?","Tu gagneras 30 XP.",[["✔ Oui, terminée",function(){complete(+p)}],["Pas encore",null,"back"]])}
 else if(a==="svc"){var bt=Object.keys(S).map(function(k){return [S[k].e+" "+S[k].n,function(){cur=k;L.setItem("service",k);stack=[["home"]];show("home")}]});
  bt.push(["Annuler",null,"back"]);ask("Choisir mon service","Ton espace s'adapte au service choisi.",bt)}
 else if(a==="mute"){mute=!mute;L.setItem("es_mute",mute?"1":"0");hud();if(!mute)snd("ok")}
 else if(a==="quit"){ask("Quitter l'espace ?","Tu retournes à l'accueil du site.",[["Oui, quitter",function(){location.href="index.html"}],["Rester",null,"back"]])}
 else if(a==="room"){snd("ok");room=p;show("community");setf($("view").querySelector('[data-a="room"][data-p="'+p+'"]'),true)}
 else if(a==="typing"){$("ci").focus()}
 else if(a==="send"){var inp=$("ci"),x=inp.value.trim();if(!x){snd("err");return}sendMsg(x.slice(0,300));inp.value="";snd("ok")}
 else if(a==="pseudo"){var n=prompt("Choisis ton pseudo (sans nom de famille) :",nom);
  if(n&&n.trim()){nom=n.trim().slice(0,20);L.setItem("nom",nom);snd("ok");show("community")}}}

document.addEventListener("click",function(e){var b=e.target.closest("[data-a]");if(!b||!AC)return;setf(b,true);act(b.dataset.a,b.dataset.p)});
document.addEventListener("mouseover",function(e){var f=e.target.closest(".foc");if(f&&f!==fo&&(modalOn()?$("box"):$("app")).contains(f))setf(f)});
document.addEventListener("keydown",function(e){
 if(!AC){if(e.key==="Enter"||e.key===" "){e.preventDefault();start()}return}
 if(e.target.tagName==="INPUT"){if(e.key==="Enter"){e.preventDefault();act("send")}else if(e.key==="Escape"){e.target.blur()}return}
 var k=e.key,m={ArrowLeft:[-1,0],ArrowRight:[1,0],ArrowUp:[0,-1],ArrowDown:[0,1]};
 if(m[k]){e.preventDefault();mv(m[k][0],m[k][1])}
 else if(k==="Enter"||k===" "){if(fo){e.preventDefault();fo.click()}}
 else if(k==="Escape"||k==="Backspace"){e.preventDefault();back()}});

// ===== Démarrage =====
function start(){if(AC)return;AC=new(window.AudioContext||window.webkitAudioContext)();
 $("splash").classList.add("off");snd("start");show("home");
 if(!L.getItem("es_wel")){L.setItem("es_wel","1");setTimeout(function(){achv("Bienvenue sur E-school","Succès débloqué : première connexion")},1200)}}
$("splash").onclick=start;
function clock(){var d=new Date();$("clk").textContent=("0"+d.getHours()).slice(-2)+":"+("0"+d.getMinutes()).slice(-2)}
clock();setInterval(clock,20000);hud();

// ===== Fond =====
var cv=$("bg"),cx=cv.getContext("2d"),P=[];function rs(){cv.width=innerWidth;cv.height=innerHeight}rs();onresize=rs;
for(var i=0;i<70;i++)P.push({x:Math.random(),y:Math.random(),r:Math.random()*1.8+.4,v:Math.random()*3e-4+8e-5,a:Math.random()*.5+.15});
(function f(){cx.clearRect(0,0,cv.width,cv.height);P.forEach(function(p){p.y-=p.v;if(p.y<0)p.y=1;cx.fillStyle="rgba(190,220,255,"+p.a+")";cx.beginPath();cx.arc(p.x*cv.width,p.y*cv.height,p.r,0,7);cx.fill()});requestAnimationFrame(f)})();
</script>
