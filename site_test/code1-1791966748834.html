<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Subway Surfers - Vrai Perso 3D</title>
    <style>
        body { margin: 0; overflow: hidden; font-family: 'Segoe UI', sans-serif; background: black; }
        #score-board { position: absolute; top: 20px; left: 20px; color: white; font-size: 28px; font-weight: bold; text-shadow: 2px 2px 0 #000; z-index: 10;}
        #gameover { display: none; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); color: white; text-align: center; background: rgba(0,0,0,0.85); padding: 40px; border-radius: 12px; border: 3px solid #ff3333; z-index: 20;}
        #loading { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); color: #00ffcc; font-size: 24px; font-weight: bold; z-index: 30;}
        button { margin-top: 15px; padding: 12px 25px; font-size: 18px; cursor: pointer; background: #ffcc00; border: none; border-radius: 5px; font-weight: bold; text-transform: uppercase; }
        button:hover { background: #fff; }
    </style>
    <!-- Three.js de base -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <!-- Le chargeur pour importer des vrais modèles 3D (GLTF/GLB) -->
    <script src="https://cdn.jsdelivr.net/gh/mrdoob/three.js@r128/examples/js/loaders/GLTFLoader.js"></script>
</head>
<body>
    <div id="loading">Chargement du personnage 3D...</div>
    <div id="score-board">Score: <span id="score">0</span></div>
    
    <div id="gameover">
        <h1 style="color: #ff3333; margin-top: 0;">CRASH !</h1>
        <p>Score Final : <span id="final-score">0</span></p>
        <button onclick="location.reload()">Recommencer</button>
    </div>

    <script>
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x87CEEB);
        scene.fog = new THREE.Fog(0x87CEEB, 10, 60);

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 100);
        camera.position.set(0, 5, 8);
        camera.lookAt(0, 0, -10);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        const light = new THREE.DirectionalLight(0xffffff, 1.2);
        light.position.set(5, 10, 5);
        scene.add(light);
        scene.add(new THREE.AmbientLight(0x808080));

        // Le Sol
        const groundGeo = new THREE.PlaneGeometry(40, 200);
        const groundMat = new THREE.MeshLambertMaterial({ color: 0x333333 });
        const ground = new THREE.Mesh(groundGeo, groundMat);
        ground.rotation.x = -Math.PI / 2;
        ground.position.z = -50;
        scene.add(ground);

        const laneWidth = 3;
        const lanes = [-laneWidth, 0, laneWidth];

        // --- LE JOUEUR (Groupe qui va contenir le modèle 3D) ---
        const player = new THREE.Group(); 
        player.position.y = 0; // Au sol
        scene.add(player);

        // Hitbox invisible (pour garder les collisions simples)
        const hitboxGeo = new THREE.BoxGeometry(1.2, 2, 1.2);
        const hitboxMat = new THREE.MeshBasicMaterial({ visible: false }); // Invisible !
        const hitbox = new THREE.Mesh(hitboxGeo, hitboxMat);
        hitbox.position.y = 1; 
        player.add(hitbox);

        // --- IMPORTATION DU VRAI PERSONNAGE ---
        const loader = new THREE.GLTFLoader();
        
        // ICI : Remplace "perso.glb" par le nom de ton fichier 3D !
        // J'utilise un modèle gratuit de test en ligne pour que tu voies que ça marche direct.
        const modelUrl = 'https://raw.githubusercontent.com/KhronosGroup/glTF-Sample-Models/master/2.0/Fox/glTF-Binary/Fox.glb';

        loader.load(modelUrl, function (gltf) {
            const model = gltf.scene;
            
            // Ajuster la taille et la rotation selon ton modèle
            model.scale.set(0.02, 0.02, 0.02); 
            model.rotation.y = Math.PI; // Le faire regarder vers l'avant

            player.add(model); // On attache le modèle à notre joueur
            
            // Cache le texte de chargement et lance le jeu
            document.getElementById('loading').style.display = 'none';
            animate(); 
        }, undefined, function (error) {
            console.error(error);
            document.getElementById('loading').innerText = "Erreur de chargement du modèle 3D !";
        });

        let currentLane = 1;
        let targetX = lanes[currentLane];
        let velocityY = 0;
        let isJumping = false;
        let speed = 0.4;
        let score = 0;
        let gameOver = false;
        const obstacles = [];

        window.addEventListener('keydown', (e) => {
            if(gameOver) return;
            if (e.code === 'ArrowLeft' && currentLane > 0) currentLane--;
            if (e.code === 'ArrowRight' && currentLane < 2) currentLane++;
            if ((e.code === 'ArrowUp' || e.code === 'Space') && !isJumping) {
                velocityY = 0.4;
                isJumping = true;
            }
            targetX = lanes[currentLane];
        });

        function spawnObstacle() {
            if(gameOver) return;
            const geo = new THREE.BoxGeometry(2, 2, 2);
            const mat = new THREE.MeshLambertMaterial({ color: 0xff3366 });
            const obs = new THREE.Mesh(geo, mat);
            const randomLane = Math.floor(Math.random() * 3);
            obs.position.set(lanes[randomLane], 1, -80);
            scene.add(obs);
            obstacles.push(obs);
            setTimeout(spawnObstacle, Math.max(400, 1500 - speed * 1200));
        }
        spawnObstacle();

        function animate() {
            if (gameOver) return;
            requestAnimationFrame(animate);

            player.position.x += (targetX - player.position.x) * 0.15;
            player.position.y += velocityY;

            if (isJumping) {
                velocityY -= 0.025; // Gravité
                if (player.position.y <= 0) {
                    player.position.y = 0;
                    isJumping = false;
                    velocityY = 0;
                }
            }

            for (let i = obstacles.length - 1; i >= 0; i--) {
                let obs = obstacles[i];
                obs.position.z += speed;

                // Collisions (basées sur la hitbox invisible, on rajoute +1 car le perso est en y=0)
                if (
                    Math.abs(obs.position.z - player.position.z) < 1.5 &&
                    Math.abs(obs.position.x - player.position.x) < 1.5 &&
                    player.position.y + 1 < obs.position.y + 1 
                ) {
                    gameOver = true;
                    document.getElementById('gameover').style.display = 'block';
                    document.getElementById('final-score').innerText = score;
                }

                if (obs.position.z > 10) {
                    scene.remove(obs);
                    obstacles.splice(i, 1);
                    score += 10;
                    document.getElementById('score').innerText = score;
                    speed += 0.002;
                }
            }
            renderer.render(scene, camera);
        }
    </script>
</body>
</html>
